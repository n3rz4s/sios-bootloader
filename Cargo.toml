[package]
name = "sios-bootloader"
version = "0.1.0"
edition = "2024"

[dependencies]
[target.'cfg(target_os = "uefi")'.dependencies]
uefi = {
    version = "0.35",
    features = [
        "alloc",
        "global_allocator",
        "panic_handler",
    ]
}


[target.'cfg(not(target_os = "uefi"))'.dependencies]
uefi = {
    version = "0.35",
    features = [
        "alloc",
    ]
}

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
overflow-checks = true

[features]
default = []
chainload-test = []


[[bin]]
name = "chainload_test"
path = "src/bin/chainload_test.rs"
required-features = ["chainload-test"]